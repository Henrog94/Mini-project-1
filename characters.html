    <!-- Character Section -->

    <main class="section">

        <div class="section-title">

            <h2>
                Choose Your Fighter
            </h2>

            <p>
                Explore fighters and learn
                what makes them unique.
            </p>

        </div>


      <!-- Character Search -->

<section class="character-controls">

    <div class="character-search">

        <label for="character-search">
            Search Fighters
        </label>

        <input
            type="text"
            id="character-search"
            placeholder="Search by character name..."
        >

    </div>


    <div class="character-filter">

        <label for="difficulty-filter">
            Difficulty
        </label>

        <select id="difficulty-filter">

            <option value="all">
                All Fighters
            </option>

            <option value="Beginner">
                Beginner
            </option>

            <option value="Intermediate">
                Intermediate
            </option>

            <option value="Advanced">
                Advanced
            </option>

        </select>

    </div>

</section>


<!-- JavaScript will put characters here -->

<div
    id="character-container"
    class="card-grid"
>

</div>


<!-- Character Details Modal -->

<div
    id="character-modal"
    class="character-modal"
>

    <div
        id="character-modal-content"
        class="modal-content"
    >

    </div>

</div>

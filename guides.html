    <!-- ================================
         GUIDE CONTENT
    ================================= -->

    <main class="section">


        <div class="section-title">

            <h1>
                SF6 Training Guides
            </h1>


            <p>
                Learn the fundamentals and
                improve your understanding
                of Street Fighter 6.
            </p>

        </div>


        <!-- Search and Filter -->

        <section class="guide-controls">


            <div class="guide-search">

                <label for="guide-search">

                    Search Guides

                </label>


                <input
                    type="text"
                    id="guide-search"
                    placeholder="Search guides..."
                >

            </div>


            <div class="guide-filter">

                <label for="guide-category">

                    Category

                </label>


                <select id="guide-category">

                    <option value="all">
                        All Categories
                    </option>


                    <option value="Beginner">
                        Beginner
                    </option>


                    <option value="Offense">
                        Offense
                    </option>


                    <option value="Defense">
                        Defense
                    </option>


                    <option value="Frame Data">
                        Frame Data
                    </option>


                    <option value="Game Systems">
                        Game Systems
                    </option>

                </select>

            </div>


        </section>


        <!-- Guide Cards -->

        <div
            id="guide-container"
            class="card-grid"
        >

        </div>


    </main>


    <!-- ================================
         GUIDE MODAL
    ================================= -->

    <div
        id="guide-modal"
        class="character-modal"
    >

        <div
            id="guide-modal-content"
            class="modal-content"
        >

        </div>

    </div>
